<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A unidade fr e o repeat()</title>
    <link rel="stylesheet" href="basic.css">
    <style>
        /* A unidade fr e o repeat() · escrevemos aqui */
        .container {
            display: grid;
            gap: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
</body>
</html>
