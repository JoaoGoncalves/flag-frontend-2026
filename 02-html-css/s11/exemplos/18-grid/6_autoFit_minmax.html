<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colunas que se adaptam: auto-fit e minmax()</title>
    <link rel="stylesheet" href="basic.css">
    <style>
        /* Colunas que se adaptam: auto-fit e minmax() · escrevemos aqui */
        .container {
            display: grid;
            gap: 5px;

            grid-template-columns: repeat(6, 100px);
            grid-template-columns: repeat(6, 1fr);
            /* grid-template-columns: repeat(auto-fit, 100px); */
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));


            grid-auto-rows: 120px;
        }

        .teste {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div class="teste">4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>10</div>
        <div>11</div>
        <div>12</div>
    </div>
</body>
</html>
