<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid e Bootstrap: o mesmo layout</title>
    <!-- Bootstrap 5, só para comparar: a grelha de 12 colunas que se usava antes do CSS Grid -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="exampleBasic.css">
    <link rel="stylesheet" href="exampleGrid.css">
</head>
<body>
    <!-- CSS Grid: o HTML é simples, o layout está todo no CSS (exampleGrid.css) -->
    <h1 class="title">CSS GRID</h1>
    <div class="wrapper">
        <div class="header">HEADER</div>
        <div class="menu">MENU</div>
        <div class="content">CONTENT</div>
        <div class="footer">FOOTER</div>
    </div>

    <!-- Bootstrap: o layout está no HTML (row, col-…) -->
    <h1 class="title">BOOTSTRAP</h1>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 header">HEADER</div>
        </div>
        <div class="row">
            <div class="col-4 menu">MENU</div>
            <div class="col-8 content">CONTENT</div>
        </div>
        <div class="row">
            <div class="col-12 footer">FOOTER</div>
        </div>
    </div>
</body>
</html>
