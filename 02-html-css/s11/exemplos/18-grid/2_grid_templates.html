<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As colunas e as linhas: grid-template-columns e grid-template-rows</title>
    <link rel="stylesheet" href="basic.css">
    <style>
        /* As colunas e as linhas: grid-template-columns e grid-template-rows · escrevemos aqui */
        .container {
            /* o contentor da grelha */
            display: grid;
            grid-template-columns: 100px auto 100px;
            grid-template-rows: 100px 300px 100px;
            gap: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
    </div>
</body>
</html>
