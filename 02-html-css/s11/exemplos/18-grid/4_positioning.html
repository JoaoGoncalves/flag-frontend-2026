<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pôr um item a ocupar várias colunas: grid-column</title>
    <link rel="stylesheet" href="basic.css">
    <style>
        /* Pôr um item a ocupar várias colunas: grid-column · escrevemos aqui */
        .container {
            display: grid;
            gap: 3px;

            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: 50px 250px 50px;
        }

        .header {
           /*  grid-column-start: 1;
            grid-column-end: 13; */

           /*  grid-column: 1 / 13; */
            /* grid-column: 1 / -1; */
            grid-column: 3 / -1;
        }

        .menu {
            /* grid-column: 1 / 3; */
            /* grid-column: 1 / span 2; */
            grid-column:  span 2;
            grid-row: 1 / 4
        }

        .content {
            /* grid-column: 3 / -1; */
            grid-column: 3 / span 10;
            grid-column: span 10;
        }

        .footer {
           /*  grid-column: 1 / -1; */
            grid-column: 3 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">HEADER</div>
        <div class="menu">MENU</div>
        <div class="content">CONTENT</div>
        <div class="footer">FOOTER</div>
    </div>
</body>
</html>
