<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O tamanho dos itens: flex e gap</title>
    <link rel="stylesheet" href="basic.css">
    <style>
        /* O tamanho dos itens: flex e gap · escrevemos aqui */
        .container {
            border: 5px solid #ffcc5c;
            display: flex;
            gap: 5px;
        }

        .home {
            flex: 1 
        }
        .search {
            flex: 3
        }
        .logout {
            flex: 2
        }


    </style>
</head>
<body>
    <nav class="container">
        <div class="home">Home</div>
        <div class="search">Search</div>
        <div class="logout">Logout</div>
    </nav>
</body>
</html>
