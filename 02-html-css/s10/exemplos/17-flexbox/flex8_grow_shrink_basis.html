<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex: grow, shrink e basis</title>
    <link rel="stylesheet" href="basic.css">
    <style>
        /* flex: grow, shrink e basis · escrevemos aqui */
        .container {
            border: 5px solid #ffcc5c;
            display: flex;
        }

        .home{
            /* flex : 
            flex-grow / flex-shrink /flex-basis
            */
            flex:1 1 auto;
        }
        .logout{
            flex: 2 0 300px;
        }
    </style>
</head>
<body>
    <nav class="container">
        <div class="home">Home</div>
        <div class="logout">Logout</div>
    </nav>
</body>
</html>
