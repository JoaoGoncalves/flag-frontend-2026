<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhar no eixo cruzado: align-items e align-self</title>
    <link rel="stylesheet" href="basic.css">
    <style>
        /* Alinhar no eixo cruzado: align-items e align-self · escrevemos aqui */
        .container {
            border: 5px solid #ffcc5c;
            display: flex;

            justify-content: center;
            align-items: center;
            align-items: end;
            align-items: stretch;
            align-items: start;
            

           /*  flex-direction: column; */

            height: 90vh;

        }

        .search{
            align-self: center;
        }
    </style>
</head>
<body>
    <nav class="container">
        <div class="home">Home</div>
        <div class="search">Search</div>
        <div class="logout">Logout</div>
    </nav>
</body>
</html>
