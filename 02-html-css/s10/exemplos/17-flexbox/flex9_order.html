<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudar a ordem: order</title>
    <link rel="stylesheet" href="basic.css">
    <style>
        /* Mudar a ordem: order · escrevemos aqui */
        .container {
            border: 5px solid #ffcc5c;
            display: flex;
        }

        .item1{
            order: 1;
        }
        .item3{
            order: -1;
        }
    </style>
</head>
<body>
    <nav class="container">
        <div class="item1">1 Home</div>
        <div class="item2">2 Search</div>
        <div class="item3">3 Logout</div>
    </nav>
</body>
</html>
