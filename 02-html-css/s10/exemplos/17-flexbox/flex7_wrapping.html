<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quando não cabem: flex-wrap</title>
    <link rel="stylesheet" href="basic.css">
    <style>
        /* Quando não cabem: flex-wrap · escrevemos aqui */
        .container {
            border: 5px solid #ffcc5c;
            display: flex;
            flex-wrap: wrap;
           /*  flex-wrap: wrap-reverse; */

        }

        .container > div{
            width: 300px;
        }
    </style>
</head>
<body>
    <nav class="container">
        <div class="home">Home</div>
        <div class="search">Search</div>
        <div class="logout">Logout</div>
    </nav>
</body>
</html>
