<!-- PARTE 3 · SINTAXE · escrito em conjunto (s01/sintaxe.html) -->
<!-- Isto é um comentário: o browser ignora-o. Serve para nós. -->

<!-- 1. Um elemento = tag de abertura + conteúdo + tag de fecho -->
<p>Esta é a minha primeira página.</p>

<!-- 2. Atributos: informação extra, sempre na tag de abertura -->
<!--    nome="valor" · em minúsculas · valor entre aspas -->
<p title="Passem o rato por aqui">Tenho uma dica escondida.</p>

<!-- 3. Void elements: não têm conteúdo nem tag de fecho -->
<p>Primeira linha<br>Segunda linha</p>

<!-- 4. Atributos booleanos: basta estarem presentes -->
<p hidden>Este parágrafo existe no código, mas não aparece.</p>

<!-- 5. Atributos globais: servem em qualquer elemento -->
<p id="intro" class="destaque" lang="en">This sentence is in English.</p>

<!-- 6. Espaços e mudanças de linha seguidos contam como UM espaço -->
<p>Muitos         espaços


   e linhas      viram um só.</p>

<!-- 7. Entidades: para escrever caracteres que o HTML usaria -->
<p>Para escrever a tag &lt;p&gt; no texto usa-se &amp;lt; e &amp;gt;.</p>
<p>&copy; 2026 · FLAG</p>
