<!DOCTYPE html>
<!-- 1. DOCTYPE: "isto é HTML moderno" (sempre a primeira linha) -->

<!-- 2. html: a raiz da árvore. lang diz a língua da página -->
<html lang="pt-PT">

  <!-- 3. head: informação SOBRE a página (não aparece no ecrã) -->
  <head>
    <!-- codificação dos caracteres: acentos e ç aparecem bem -->
    <meta charset="UTF-8">
    <!-- em telemóveis, usar a largura real do ecrã -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- resumo que o Google pode mostrar nos resultados -->
    <meta name="description" content="A minha primeira página com a estrutura completa.">
    <!-- título do separador do browser (obrigatório) -->
    <title>A minha primeira página · FLAG</title>
  </head>

  <!-- 4. body: tudo o que se vê -->
  <body>
    <p>Olá, FLAG!</p>
    <p>Esta página tem a estrutura completa de um documento HTML.</p>
  </body>

</html>
